services:
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/catalog-service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
